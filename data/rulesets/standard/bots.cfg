; Bot skill levels (T-95 to T-99). Bots drive the same toy body as players, with the same
; weapons, battery and rules (T-98): everything here shapes what a bot decides, never what its
; toy can do. [shared] holds values every level uses; a level section may override any of them.
; Levels are listed easiest first. The loader checks every value (src/sim/bots/bot_skills.gd).
;
; Ours: the classic has no bots in multiplayer, only scripted drones (recon bots-training.md).
; Easy is the classic's drone exactly: sight 500, aim turn 1 + gap/20 degrees per 60 Hz step
; (60 °/s + 3 × gap per second) stopping inside 3 degrees, first wait 3 s then bursts of
; 0 to 5 s after waits of 0 to 8 s. Normal and hard are ours.

[levels]

order=["easy", "normal", "hard"]

[shared]

; How often a bot looks for enemies and items, s
look_interval=0.05
; How often a bot picks what to do next, s
think_interval=0.25
; Seconds an enemy out of sight stays in mind
memory=4.0
; Wander: a new place to go every wander_min to wander_max s (the classic: 15 to 30)
wander_min=15.0
wander_max=30.0
; Stuck: moved less than stuck_distance u in stuck_time s (the classic: 15 u in 3 s)
stuck_time=3.0
stuck_distance=15.0
; Battery: below battery_low share of full the bot stops flying until it is back to battery_resume
battery_low=0.2
battery_resume=0.7
; Flying: cruise at this share of the fly speed, slow down within arrive u of the goal
cruise_share=0.75
arrive=80.0
steer_gain=4.0
; A waypoint counts as reached within this, u
reach=20.0
; Keep this share of the held gun's range from the target, between fight_min and fight_max u
fight_share=0.45
fight_min=90.0
fight_max=320.0
; Slide side to side while fighting, up to strafe u, a new slide every strafe_min to strafe_max s
strafe=60.0
strafe_min=1.0
strafe_max=2.5
; Swing the melee weapon when the target is this close, u
melee_range=28.0
; Frags: throw at targets between these distances, u, never with a teammate this close to them
grenade_min=130.0
grenade_max=360.0
grenade_mate_gap=140.0
; Frags roll on after they land: aim to land this share of the way to the target
grenade_land_share=0.4
; Seconds a bot may take to line its aim up for a throw before it gives up
throw_aim_time=1.0
; Worth of a frag pickup under the cap, against 1 for a gun when a hand is free
frag_value=0.4
; Places tried when looking for cover
cover_tries=8.0
; Go for a health pack below this share of health; fall back to cover below retreat_health share
want_health=0.7
retreat_health=0.3
; Reload when not fighting and the magazine is below this share
reload_share=0.5
; T-95 Sight is checked from this far above the body origin, u (the classic: 20)
eye_height=20.0
; Navigation grid cell, u, and the extra cost of a cell with no floor under it (prefer walking)
nav_cell=32.0
air_cost=0.6

[easy]

; T-95 Sight, u, with a clear line
sight=500.0
; Reaction: an enemy must be in sight this long before the bot reacts, s
reaction=0.6
; T-96 Aim turn per second = turn_rate + turn_gain × gap (degrees), stopping inside aim_dead_zone
turn_rate=60.0
turn_gain=3.0
aim_dead_zone=3.0
; Aim error: the aim point wobbles up to this many degrees, rolled every aim_wobble s
aim_error=6.0
aim_wobble=0.4
; Lead: share of the target's velocity over the bullet's travel time added to the aim point
lead=0.0
; Fire only with the aim this close to the target, degrees
fire_cone=8.0
; T-97 Fire rhythm: first wait and burst, then waits and bursts at random in these ranges, s
first_wait=3.0
first_burst=3.0
wait_min=0.0
wait_max=8.0
burst_min=0.0
burst_max=5.0
; Least time between frags, s
grenade_cooldown=20.0

[normal]

sight=600.0
reaction=0.35
turn_rate=90.0
turn_gain=4.5
aim_dead_zone=2.0
aim_error=3.5
aim_wobble=0.4
lead=0.5
fire_cone=6.0
first_wait=1.2
first_burst=3.0
wait_min=0.3
wait_max=3.0
burst_min=1.0
burst_max=4.0
grenade_cooldown=10.0

[hard]

sight=750.0
reaction=0.18
turn_rate=150.0
turn_gain=7.0
aim_dead_zone=1.0
aim_error=1.5
aim_wobble=0.3
lead=0.9
fire_cone=4.0
first_wait=0.4
first_burst=4.0
wait_min=0.2
wait_max=1.2
burst_min=2.0
burst_max=5.0
