; Guns, general (T-40 to T-49). The per-weapon rows are in weapons.cfg (T-50).

[guns]

; T-40 Headshot multiplier; never on a crouched target, never for melee
headshot_factor=1.5
; T-41 Range falloff: full damage up to this share of the range, then
;      × (1 − (d − share × range) / range), which is 0.5 at max range
falloff_start_share=0.5
; T-42 Share of the shooter's velocity a bullet inherits
inherit_velocity=0.8
; T-43 Bullets fade over the last this many u before max range (drawn only)
bullet_fade=100.0
; T-45 Pickup reach, u around the toy, checked this many u above its centre
pickup_reach=35.0
pickup_reach_up=5.0
; T-46 Melee: swing time s; lunge meter max, cost per swing, refill per s (u/s of lunge);
;      no lunge while faster than lunge_speed_cap × weight factor, u/s
melee_swing=0.35
lunge_meter_max=125.0
lunge_cost=35.0
lunge_refill=45.0
lunge_speed_cap=320.0
; T-47 Bare-hand melee damage, HP
bare_hand_damage=10.0
; no T-ID yet. Bare-hand reach, u; the classic's fist reach was not recovered, ours = the pistol's
bare_hand_reach=35.0
