; Controls and camera (T-80 to T-89), plus the blast shake strength the camera applies (T-63;
; how far a blast shakes is throwables.cfg blast_shake_reach).

[camera]

; T-84 Camera anchor: the toy body sits this many points below the middle of the screen
anchor_below_middle=15.0
; T-88 View area: world height a 16:9 screen shows at 1X. Every screen shape sees the same
;      world area (ours: 360 makes a toy about an eighth of the screen, docs/art "Punch").
view_height=360.0

; T-80 Zoom ladder: view scale for 1X to 7X (lower shows more map). A weapon lists the levels it allows (T-50).
zoom_scale_1=1.0
zoom_scale_2=0.9
zoom_scale_3=0.8
zoom_scale_4=0.7
zoom_scale_5=0.6
zoom_scale_6=0.5
zoom_scale_7=0.4
; T-81 Aim look-ahead: the view shifts (W/4, H/4) x this share x the weapon's factor toward the aim.
;      The player's default (AIM OFFSET 75%); the player may set their own (US-42.1).
look_ahead=0.75
; T-81 Weapon factor floor, and the factor with no gun
look_ahead_floor=0.2
look_ahead_bare=0.25
; T-82 Look-ahead panning speed, /s (player default)
panning_speed=1.5
; T-83 Zoom speed, /s; 0 is instant (player default)
zoom_speed=12.0
; T-85 Stick radius at size 1, points
stick_radius=40.0
; T-85 A touch starting within this many points of a stick goes to it
stick_capture=90.0
; T-85 Knob return: share of the way back to centre per 1/60 s once let go
knob_return=0.2
; T-87 Radar: arrows for off-screen toys within this range, u
radar_range=1300.0
; T-87 ... that move faster than this, u/s (or just fired)
radar_speed=180.0
; T-87 Arrow ring radius, share of screen height
radar_ring=0.375
; T-87 A toy this far outside the view still counts as on screen, u
radar_margin=50.0
; T-63 Shake strength ((155 x power - d) x power x 0.1), at least 1, u
shake_peak_reach=155.0
shake_scale=0.1
shake_min=1.0
