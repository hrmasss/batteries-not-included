; Hitbox (T-18). The same for every toy (sources #21). Units u, y up, measured from the
; body origin. The body box spans body_bottom to body_top; the feet are at body_bottom.

[hitbox]

; T-18 Body box, 24 wide × 20 tall
body_width=24.0
body_bottom=-15.0
body_top=5.0
; T-18 Head circle, radius 10.5, centred 14 above the body origin
head_radius=10.5
head_height=14.0
; T-18 Crouch box, about 17 × 8. While crouched it replaces the head; the body box stays.
crouch_width=17.0
crouch_bottom=0.0
crouch_top=8.0
