; Throwables and blasts (T-60 to T-69). Launch ships the frag only (sources #24).

[throwables]

; T-60 Grenade carry cap, all types together
grenade_cap=4
; T-61 Throw speed along the aim, u/s, plus the thrower's velocity; spawns this many u out from the hand
throw_speed=400.0
throw_offset=7.0
; T-62 Frag: fuse s from the throw; gravity u/s² (× the map's item gravity); speed kept per s; bounce
frag_fuse=1.75
frag_gravity=250.0
frag_speed_kept=0.99
frag_bounce=0.1
; no T-ID yet. Frag friction on a bounce, the classic's 0.99
frag_friction=0.99
; T-63 Frag blast power
frag_power=1.0
; T-63 Blast: radius blast_radius × power; damage (blast_damage × power − blast_falloff × d) × power,
;      at least blast_min_damage inside the radius
blast_radius=125.0
blast_damage=100.0
blast_falloff=0.8
blast_min_damage=10.0
; T-63 Blast knockback, u/s per HP of damage, counting at most blast_knockback_cap HP
;      (the classic: impulse up to 40 on a toy of mass 0.1)
blast_knockback_per_hp=10.0
blast_knockback_cap=40.0
; T-63 Screen shake reach, u × power
blast_shake_reach=150.0
; T-67 Rocket: direct hit HP; arms after s of flight; self-destructs at s; speed cap u/s
rocket_direct_damage=100.0
rocket_arm_time=0.5
rocket_life=5.0
rocket_speed_cap=500.0
; T-67 Rocket blast power. Ours: the classic's rocket power was not read; 1.0 = a frag's
rocket_power=1.0
; no T-ID yet. An unarmed rocket bounces off walls by this much
rocket_bounce=0.1
