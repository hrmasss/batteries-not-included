; Weapon table (T-50). One section per weapon; the section name is the weapon's id, which
; maps and pickup points use. Every weapon is a row of data (US-11.3): a new weapon of an
; existing kind needs no code. The loader checks every field (src/sim/combat/weapon_table.gd).
;
; kind          bullet (pellets that travel), rocket (a projectile that blasts), melee (no gun)
; damage        HP per bullet or pellet (rocket: unused, see throwables.cfg rocket_*)
; pellets       bullets per shot
; spread        degrees either side of the aim each pellet may go (T-44: random, rolled by the sim)
; interval      s between shots (between bursts for a burst weapon)
; burst, burst_gap   rounds per trigger pull and s between them (1 and 0 for most)
; spin_up       s the trigger is held before the first shot (0 for most)
; mag           rounds in a full magazine
; start_reserve, max_reserve   reserve a fresh weapon carries, and the most it can carry
; reload        s
; range         u a bullet flies at most (falloff T-41 works on it)
; bullet_speed  u/s
; zoom          allowed levels on the zoom ladder (T-80), 1 to 7
; weight        movement factor (T-19)
; melee_damage  HP per melee swing with this weapon held
; melee_reach   u from the body to the target's hitbox
; dual          can go in the off hand (US-08)
;
; Values: docs/specs/04_tuning.md T-50 (workspace); melee reach from the classic's melee length
; (recon weapons.md). Launch weapons only (sources #24); the rest of the arsenal comes in R2.

