; Battery (T-20 to T-29). The battery is the jetpack's fuel.
; T-25, derived, not a setting: full-up flight from full = battery_full / drain_rate
; (about 4.8 s); refill from empty = refill_pause + battery_full / refill_rate (11 s).

[battery]

; T-20 Battery full, charge. A map may set its own; so may the battery_size modifier.
battery_full=100.0
; T-21 Drain while flying: drain_rate × (drain_floor_share + (1 − drain_floor_share) × stick up),
;      21 straight up, 10.5 sideways, charge/s
drain_rate=21.0
drain_floor_share=0.5
; T-22 Refill pause after thrust stops, s
refill_pause=1.0
; T-23 Refill rate, charge/s
refill_rate=10.0
; T-24 Battery pack: the battery is held full for this many s; clears EMP (R2)
battery_pack_time=30.0
