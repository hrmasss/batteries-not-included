; Health (T-30 to T-39).

[health]

; T-30 Max health, health on spawn, HP
max_health=100.0
; T-31 Health regen, HP/s, from the moment of damage, no delay
regen_rate=1.0
; T-32 Health pack: pack_instant HP at once, then pack_flow HP more at pack_flow_rate HP/s;
;      only taken below full
pack_instant=10.0
pack_flow=90.0
pack_flow_rate=100.0
; T-33 Hit knockback, u/s per HP of damage, at most knockback_cap u/s per axis
;      (the classic: 0.16 impulse per HP, at most 10, on a toy of mass 0.1)
knockback_per_hp=1.6
knockback_cap=100.0
; T-34 Out of bounds: out_of_bounds_damage HP every out_of_bounds_interval s outside the map's bounds
out_of_bounds_damage=5.0
out_of_bounds_interval=0.1
