; Movement (T-1 to T-19). Units: u is a world unit (1/64 of a tile), s seconds,
; stick values -1 to 1 with up positive.

[movement]

; T-1 Walking gravity, u/s² down
walk_gravity=300.0
; T-2 Flying gravity, u/s² down
fly_gravity=50.0
; T-3 Walk speed: walk_speed × stick sideways × weight factor, u/s
walk_speed=190.0
; T-4 Walk catch-up rate: walk_catch_up × weight factor, share of missing speed closed per second
walk_catch_up=3.0
; T-5 Fly speed: fly_speed × weight factor, u/s
fly_speed=300.0
; T-6 Fly catch-up rate: fly_catch_up × weight factor × stick deflection, per second
fly_catch_up=1.5
; T-7 Speed kept per second (air drag), share
speed_kept_per_second=0.55
; T-8 Top speed, u/s
top_speed=600.0
; T-9 Ground brake: full below brake_full_below, none above brake_none_above, linear between;
;     removes up to brake_rate × step time of the speed
brake_full_below=20.0
brake_none_above=60.0
brake_rate=50.0
; T-10 Jump, u/s up
jump_speed=220.0
; T-11 Jump stick threshold, stick up
jump_stick_up=0.75
; T-12 Jump cooldown and ground grace, s
jump_cooldown=0.5
jump_ground_grace=0.25
; T-13 Airtime before the jetpack engages, s
engage_airtime=0.5
; T-14 Jetpack engage stick: deflection above engage_deflection and up above engage_up
engage_deflection=0.75
engage_up=0.5
; T-15 Landing cut-off with the stick pulled down, u/s
landing_cutoff_speed=75.0
; T-16 Crouch start (stick down), crouch hold (stick down), stand-up delay (s)
crouch_start_down=0.75
crouch_hold_down=0.5
stand_up_delay=0.2
; T-17 Body lean, weight on facing (the stick gets the rest): flying 0.93 : 0.07, otherwise 0.6 : 0.4
lean_facing_flying=0.93
lean_facing_ground=0.6
; T-19 Weight factor: primary × (off-hand × (1 − share) + share); 0.5 gives primary × (off-hand + 1) / 2.
;      Weapon weights live in the weapon table (T-50).
offhand_weight_share=0.5
