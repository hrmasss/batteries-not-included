; Match (T-68, T-70 to T-79): spawning, protection, pickups.

[match]

; T-70 Respawn wait after a pop, s
respawn_wait=9.0
; T-68 Spawn protection, s. Ours: against everything, ends when the toy attacks (sources #24)
spawn_protection=2.0
; T-71 Spawn point score = enemy weight × distance to each living enemy
;      + explosive weight × distance to each live explosive; pick at random from the best share;
;      skip points used in the last spawn_reuse_block s
spawn_enemy_weight=1.0
spawn_explosive_weight=0.5
spawn_pick_share=0.5
spawn_reuse_block=5.0
; T-76 Pickup respawn interval, s; 0 turns map pickups off. A pickup point may set its own
pickup_interval=60.0
; T-77 Floor lifetime: a map item lasts its interval less floor_lifetime_lead s and fades over the
;      last floor_fade s; an empty dropped gun lasts empty_gun_lifetime s
floor_lifetime_lead=1.0
floor_fade=9.0
empty_gun_lifetime=9.0
; no T-ID yet. A dropped gun with ammo left lasts this long, s (ours: the default interval less 1)
dropped_gun_lifetime=59.0
; T-77 Crowding: above crowd_start items on the floor lifetimes shrink, down to crowd_min_share
;      of full at crowd_full items
crowd_start=30.0
crowd_full=60.0
crowd_min_share=0.25
; T-72 Match length, s: the default, and the choices a host gets (min to max in steps)
match_length=390.0
match_length_min=60.0
match_length_max=900.0
match_length_step=30.0
; T-73 Kill limit: a host toggle, off by default (sources #24); the limit when it is on, kills
kill_limit_on=false
kill_limit=20.0
; T-75 Players per match: most, default and least
players_max=12.0
players_default=8.0
players_min=2.0
; T-78 Teams in team deathmatch. Ours: 2 to 4 (sources #24)
teams_min=2.0
teams_max=4.0
