name: android

on:
  push:
    branches: [main]
  pull_request:

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GODOT_VERSION: 4.7.2
      # SHA-512 of Godot_v4.7.2-stable_linux.x86_64.zip and of the export templates, from the
      # release's SHA512-SUMS.txt.
      GODOT_SHA512: 9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65
      TEMPLATES_SHA512: ca4d71c4d7b81dfc15d1a98baa07534aa95b03fdda78a0075b06672e1648d2e5f40980c9adc28d23e1b92e732ee7bf3461997aa804af74ec2fcd7a93ccb84079
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK parts the Gradle template asks for
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-36" "build-tools;36.1.0" >/dev/null

      - name: Install Godot ${{ env.GODOT_VERSION }}
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          zip="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL -o "$RUNNER_TEMP/$zip" "$base/$zip"
          (cd "$RUNNER_TEMP" && echo "$GODOT_SHA512  $zip" | sha512sum -c -)
          unzip -q "$RUNNER_TEMP/$zip" -d "$RUNNER_TEMP/godot"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Cache the Android export templates
        id: templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-android-templates-${{ env.GODOT_VERSION }}

      - name: Install the Android export templates
        if: steps.templates.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          tpz="Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          curl -fsSL -o "$RUNNER_TEMP/$tpz" "$base/$tpz"
          (cd "$RUNNER_TEMP" && echo "$TEMPLATES_SHA512  $tpz" | sha512sum -c -)
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest"
          # Only what an Android export reads; the full set is 1.3 GB.
          unzip -q -j "$RUNNER_TEMP/$tpz" templates/version.txt templates/android_debug.apk \
            templates/android_release.apk templates/android_source.zip -d "$dest"
          rm "$RUNNER_TEMP/$tpz"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ env.GODOT_VERSION }}-${{ hashFiles('export_presets.cfg') }}
          restore-keys: gradle-${{ env.GODOT_VERSION }}-

      - name: Build the debug APK
        run: tools/build-android.sh debug build/android/bni-debug.apk

      - name: Keep the APK
        uses: actions/upload-artifact@v4
        with:
          name: bni-debug-apk
          path: build/android/bni-debug.apk
          if-no-files-found: error
          retention-days: 14
